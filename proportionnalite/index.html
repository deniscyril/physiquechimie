<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proportionnalité de deux grandeurs</title>
<style>
:root {
  --bg:        #f3f4fd;
  --card:      #ffffff;
  --border:    #dde0f0;
  --text:      #1e1e2e;
  --muted:     #6b7280;
  --primary:   #5448c8;
  --primary-d: #3e34a8;
  --p1:        #7c3aed;
  --p2:        #0891b2;
  --lvl2:      #059669;
  --lvl1:      #d97706;
  --lvlT:      #be185d;
  --amber:     #d97706;
  --amber-bg:  #fffbeb;
  --amber-bd:  #fcd34d;
  --alg:       #4f6dc8;
  --alg-bg:    #eef1ff;
  --alg-bd:    #a5b4fc;
  --ok:        #16a34a;
  --ok-bg:     #dcfce7;
  --ok-bd:     #86efac;
  --err:       #dc2626;
  --err-bg:    #fef2f2;
  --err-bd:    #fca5a5;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Georgia', serif;
  background: var(--bg);
  color: var(--text);
  font-size: 17px;
  line-height: 1.6;
}
#app {
  max-width: 780px;
  margin: 0 auto;
  padding: 24px 20px 80px;
}

h1 {
  font-size: 1.5rem;
  font-weight: normal;
  color: var(--text);
  border-bottom: 2px solid var(--border);
  padding-bottom: 10px;
  margin-bottom: 28px;
}

.phase-label {
  display: inline-block;
  color: white;
  font-size: 0.78rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 3px 10px;
  border-radius: 20px;
  margin-bottom: 16px;
  font-family: sans-serif;
  font-weight: 600;
}
.p1-label   { background: var(--p1); }
.p2-label   { background: var(--p2); }
.lvl2-label { background: var(--lvl2); }
.lvl1-label { background: var(--lvl1); }
.lvlT-label { background: var(--lvlT); }

.btn-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: none;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  color: var(--muted);
  font-size: 0.88rem;
  font-family: inherit;
  padding: 6px 14px;
  cursor: pointer;
  margin-bottom: 22px;
  text-decoration: none;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
}
.btn-back:hover { background: #e8eaff; border-color: var(--primary); color: var(--primary); }

/* ── HOME ── */
.home-title {
  font-size: 1.7rem;
  font-weight: bold;
  color: var(--primary);
  margin-bottom: 8px;
}
.home-subtitle {
  color: var(--muted);
  font-size: 0.97rem;
  margin-bottom: 32px;
  max-width: 620px;
  line-height: 1.65;
}
.home-section {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 700;
  font-family: sans-serif;
  color: var(--muted);
  margin: 28px 0 12px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.phase-cards { display: flex; flex-direction: column; gap: 14px; }
.phase-card {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 18px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  cursor: pointer;
  transition: box-shadow 0.15s, border-color 0.15s, transform 0.1s;
}
.phase-card:hover { box-shadow: 0 4px 16px rgba(84,72,200,0.13); transform: translateY(-1px); }
.phase-card.p1:hover   { border-color: var(--p1); }
.phase-card.p2:hover   { border-color: var(--p2); }
.phase-card.lvl2:hover { border-color: var(--lvl2); }
.phase-card.lvl1:hover { border-color: var(--lvl1); }
.phase-card.lvlT:hover { border-color: var(--lvlT); }
.phase-card-num {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  font-weight: 700;
  margin-bottom: 4px;
  font-family: sans-serif;
}
.p1 .phase-card-num   { color: var(--p1); }
.p2 .phase-card-num   { color: var(--p2); }
.lvl2 .phase-card-num { color: var(--lvl2); }
.lvl1 .phase-card-num { color: var(--lvl1); }
.lvlT .phase-card-num { color: var(--lvlT); }
.phase-card-title { font-size: 1.05rem; font-weight: bold; color: var(--text); margin-bottom: 3px; }
.phase-card-desc  { font-size: 0.87rem; color: var(--muted); }
.phase-card-arrow { font-size: 1.3rem; color: #ccc; flex-shrink: 0; }
.phase-card:hover .phase-card-arrow { color: var(--primary); }

/* ── MODELAGE ── */
.technique {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  margin-bottom: 28px;
  overflow: hidden;
}
.technique-header {
  background: linear-gradient(135deg, #ede9fe 0%, #dbeafe 100%);
  padding: 12px 18px;
  font-weight: bold;
  font-size: 1rem;
  border-bottom: 1.5px solid var(--border);
  color: var(--primary-d);
}
.technique-body { padding: 18px; }

.objectif-line {
  background: #f0f0ff;
  border: 1.5px solid #c4b5fd;
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 16px;
  font-size: 0.97rem;
  color: #3b2b8a;
}
.objectif-line strong { color: var(--p1); }

.example-header {
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-family: sans-serif;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 10px;
  margin-top: 18px;
}
.example-q {
  font-size: 1.05rem;
  margin-bottom: 12px;
  color: var(--text);
}
.example-q strong { color: var(--primary); }

.bloc {
  border-radius: 8px;
  padding: 14px 16px;
  margin-bottom: 12px;
}
.bloc:last-child { margin-bottom: 0; }
.bloc-alg    { background: var(--alg-bg);   border-left: 4px solid var(--alg-bd); }
.bloc-result { background: var(--amber-bg); border-left: 4px solid var(--amber-bd); }

.bloc-title {
  font-size: 0.74rem;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  font-weight: 700;
  margin-bottom: 8px;
  font-family: sans-serif;
}
.bloc-alg    .bloc-title { color: var(--alg); }
.bloc-result .bloc-title { color: var(--amber); }

.step { display: flex; gap: 8px; margin-bottom: 5px; align-items: baseline; line-height: 1.5; }
.step-arrow { color: var(--muted); flex-shrink: 0; font-size: 0.9rem; margin-top: 1px; }
.step-num {
  width: 20px; height: 20px;
  background: var(--alg);
  color: white;
  border-radius: 50%;
  font-size: 0.7rem;
  font-family: sans-serif;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 2px;
}

.formula-box {
  font-size: 1.1rem;
  font-weight: bold;
  background: #fff;
  border: 1.5px solid var(--amber-bd);
  border-radius: 6px;
  padding: 6px 14px;
  display: inline-block;
  margin-top: 6px;
  color: #92400e;
}

.note-box {
  background: #f0f0ff;
  border: 1.5px solid #c4b5fd;
  border-radius: 8px;
  padding: 12px 16px;
  margin-top: 14px;
  font-size: 0.93rem;
  color: #3b2b8a;
}

/* ── TABLEAU DE PROPORTIONNALITÉ ── */
.prop-table-wrap { overflow-x: auto; margin-bottom: 14px; }
.prop-table {
  border-collapse: collapse;
  font-size: 0.95rem;
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: 8px;
}
.prop-table th {
  background: #f0f0ff;
  font-family: sans-serif;
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--primary-d);
  text-align: left;
  padding: 8px 14px;
  border: 1px solid var(--border);
  white-space: nowrap;
}
.prop-table td {
  padding: 8px 16px;
  border: 1px solid var(--border);
  text-align: center;
  font-family: 'Courier New', monospace;
  font-weight: bold;
  white-space: nowrap;
}

/* ── GRAPHIQUES ── */
.graph-wrap { margin-bottom: 14px; }
.graph {
  display: block;
  width: 100%;
  max-width: 430px;
  height: auto;
  background: #fff;
  border: 1.5px solid var(--border);
  border-radius: 8px;
}
.graph .ax     { font: 11px sans-serif; fill: var(--muted); }
.graph .ax-t   { font: 700 11.5px sans-serif; fill: var(--text); }
.graph .pt-lbl { font: 700 12.5px sans-serif; fill: #92400e; }
.graph-row { display: flex; gap: 14px; flex-wrap: wrap; }
.graph-row > div { flex: 1 1 260px; min-width: 240px; }
.graph-caption {
  font-size: 0.85rem;
  font-family: sans-serif;
  color: var(--muted);
  margin-top: 6px;
  line-height: 1.45;
}
.graph-caption strong.oui { color: var(--ok); }
.graph-caption strong.non { color: var(--err); }

/* ── BOUTONS ── */
.btn {
  display: inline-block;
  padding: 10px 24px;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  font-size: 0.95rem;
  font-family: inherit;
  font-weight: 600;
  transition: background 0.15s, transform 0.1s;
}
.btn:hover { transform: translateY(-1px); }
.btn:disabled { opacity: 0.6; cursor: default; transform: none; }
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-d); }
.btn-p2 { background: var(--p2); color: white; }
.btn-p2:hover { background: #0e7490; }
.btn-lvl2 { background: var(--lvl2); color: white; }
.btn-lvl2:hover { background: #047857; }
.btn-lvl1 { background: var(--lvl1); color: white; }
.btn-lvl1:hover { background: #b45309; }
.btn-lvlT { background: var(--lvlT); color: white; }
.btn-lvlT:hover { background: #9d174d; }
.btn-hint {
  background: var(--amber-bg);
  color: #92400e;
  border: 1.5px solid var(--amber-bd);
  font-size: 0.88rem;
  padding: 7px 16px;
  font-weight: normal;
}
.btn-hint:hover { background: #fef3c7; }
.btn-outline {
  background: none;
  border: 1.5px solid var(--border);
  color: var(--muted);
  font-size: 0.9rem;
  padding: 9px 20px;
}
.btn-outline:hover { border-color: var(--primary); color: var(--primary); background: #eef0ff; }

.nav-bottom { margin-top: 32px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

.page-intro {
  background: #f0fff8;
  border: 1.5px solid #6ee7b7;
  border-radius: 8px;
  padding: 12px 16px;
  margin-bottom: 24px;
  font-size: 0.93rem;
  color: #064e3b;
  font-family: sans-serif;
}

/* ── EXERCICES ── */
.exercise-card {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 18px;
  transition: box-shadow 0.15s;
}
.exercise-card:focus-within { box-shadow: 0 0 0 3px rgba(84,72,200,0.12); }
.exercise-num {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--muted);
  margin-bottom: 4px;
  font-family: sans-serif;
  font-weight: 700;
}
.contexte-tag {
  display: inline-block;
  font-size: 0.73rem;
  font-family: sans-serif;
  color: var(--muted);
  background: #f3f4fd;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1px 8px;
  margin-bottom: 10px;
}
.exo-intro { font-size: 0.97rem; margin-bottom: 12px; color: var(--text); }
.exercise-question { font-size: 1.05rem; margin-bottom: 10px; line-height: 1.7; }
.exercise-question strong { color: var(--primary); }

.format-hint {
  font-size: 0.78rem;
  color: var(--muted);
  font-family: sans-serif;
  margin-bottom: 10px;
}
.format-hint code {
  background: #f3f4fd;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 5px;
  font-size: 0.78rem;
  color: var(--primary);
  font-family: 'Courier New', monospace;
}

.input-row {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.answer-input {
  font-size: 16px;
  font-family: 'Courier New', monospace;
  padding: 8px 12px;
  border: 2px solid var(--border);
  border-radius: 8px;
  width: 190px;
  outline: none;
  background: #fafbff;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.answer-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(84,72,200,0.12); }
.answer-input.correct   { border-color: var(--ok);  background: var(--ok-bg); }
.answer-input.incorrect { border-color: var(--err); background: var(--err-bg); }
.answer-input:disabled  { opacity: 0.7; }
.unit-suffix { font-size: 0.98rem; font-weight: bold; color: var(--text); }

/* QCM */
.mcq-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.mcq-btn {
  text-align: left;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  background: #fafbff;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.95rem;
  color: var(--text);
  transition: border-color 0.12s, background 0.12s;
}
.mcq-btn:hover:not(:disabled) { border-color: var(--primary); background: #eef0ff; }
.mcq-btn:disabled { cursor: default; }
.mcq-btn.correct   { border-color: var(--ok);  background: var(--ok-bg); }
.mcq-btn.incorrect { border-color: var(--err); background: var(--err-bg); }

.hint-box {
  background: var(--amber-bg);
  border: 1.5px solid var(--amber-bd);
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 10px;
  font-size: 0.93rem;
  color: #78350f;
  display: none;
}
.hint-box.visible { display: block; }

.feedback-box {
  border-radius: 8px;
  padding: 12px 14px;
  margin-top: 8px;
  font-size: 0.93rem;
  display: none;
}
.feedback-box.visible { display: block; }
.feedback-ok  { background: var(--ok-bg);  border: 1.5px solid var(--ok-bd);  color: #14532d; }
.feedback-err { background: var(--err-bg); border: 1.5px solid var(--err-bd); color: #7f1d1d; }

.corr-steps { margin-top: 10px; font-size: 0.92rem; }
.corr-steps .step { margin-bottom: 4px; }

.step-tag {
  font-size: 0.74rem;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  font-weight: 700;
  font-family: sans-serif;
  color: var(--alg);
  margin-bottom: 8px;
}

/* ── Interactions graphiques ── */
.graph.clickable { cursor: crosshair; }
.pt-click { cursor: pointer; }
.pt-click:hover { stroke: var(--amber); stroke-width: 2.5; }

.rs-status {
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 12px;
  font-size: 0.93rem;
  background: #f3f4fd;
  border: 1.5px solid var(--border);
  color: var(--muted);
}
.rs-status.warn { background: var(--amber-bg); border-color: var(--amber-bd); color: #78350f; }
.rs-status.good { background: var(--ok-bg);   border-color: var(--ok-bd);   color: #14532d; }

/* QCM à choix visuels (graphiques ou tableaux) */
.mcq-options.mcq-visual { flex-direction: row; flex-wrap: wrap; align-items: stretch; }
.mcq-visual .mcq-btn { flex: 1 1 200px; min-width: 180px; }
.mcq-visual .prop-table-wrap { margin-bottom: 0; overflow-x: visible; display: flex; justify-content: center; }
.mcq-glab {
  font-size: 0.78rem;
  font-family: sans-serif;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 6px;
  text-align: center;
}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ═══════════════════════════════════════════════════════
// UTILITAIRES
// ═══════════════════════════════════════════════════════

// Affiche une valeur avec virgule française
function fv(v) {
  return v.toString().replace('.', ',');
}

function sup(n) { return `<sup>${n}</sup>`; }

function parseAnswer(raw) {
  let s = raw.trim();
  if (!s) return null;
  // Superscripts → ASCII ("10⁻³⁴" → "10^-34")
  const supMap = { '⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5',
                   '⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁻':'-','⁺':'+' };
  s = s.replace(/(10)([⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]+)/g, '$1^$2');
  s = s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]/g, c => supMap[c]);
  // Espaces (y compris séparateurs de milliers)
  s = s.replace(/[\s  ]/g, '');
  // Virgule française → point
  s = s.replace(',', '.');
  // Signes de multiplication → *
  s = s.replace(/[×·]/g, '*');
  // "3.10^-2" (notation française) → "3*10^-2"
  s = s.replace(/(\d)\.(10\^)/g, '$1*$2');
  // Forme 3*10^-2
  const m = s.match(/^(-?[\d.]+)\*10\^([+-]?\d+)$/);
  if (m) return parseFloat(m[1]) * Math.pow(10, parseInt(m[2]));
  // Nombre simple ou notation e
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

function isCorrect(parsed, expected, tol) {
  if (parsed === null || !isFinite(parsed)) return false;
  if (expected === 0) return Math.abs(parsed) < 1e-15;
  return Math.abs((parsed - expected) / expected) <= tol;
}

// ═══════════════════════════════════════════════════════
// GRAPHIQUES SVG
// ═══════════════════════════════════════════════════════
// g : { xmax, xstep, ymax, ystep, xlabel, ylabel,
//       slope?, intercept?, curve? (a : y = a·x²),
//       points? [[x,y]], readPoint? [x,y] }

const GDIM = { W: 420, H: 320, ml: 54, mr: 18, mt: 26, mb: 44 };

// Correspondance coordonnées graphique ↔ pixels SVG (et clics utilisateur)
function graphMap(g) {
  const { W, H, ml, mr, mt, mb } = GDIM;
  const pw = W - ml - mr, ph = H - mt - mb;
  return {
    X: x => ml + x / g.xmax * pw,
    Y: y => mt + ph - y / g.ymax * ph,
    fromEvent(evt, svg) {
      const r = svg.getBoundingClientRect();
      const sx = (evt.clientX - r.left) * W / r.width;
      const sy = (evt.clientY - r.top) * H / r.height;
      return { x: (sx - ml) / pw * g.xmax, y: (mt + ph - sy) / ph * g.ymax };
    },
  };
}

function graphSVG(g) {
  const { W, H, ml, mt } = GDIM;
  const { X, Y } = graphMap(g);
  const flab = v => fv(parseFloat(v.toFixed(6)));
  let s = '';

  // Grille verticale + graduations x
  const nx = Math.round(g.xmax / g.xstep);
  for (let i = 0; i <= nx; i++) {
    const x = i * g.xstep;
    s += `<line x1="${X(x)}" y1="${Y(0)}" x2="${X(x)}" y2="${Y(g.ymax)}" stroke="${i === 0 ? '#9ca3af' : '#e8e8f2'}" stroke-width="${i === 0 ? 1.5 : 1}"/>`;
    s += `<text x="${X(x)}" y="${Y(0) + 16}" text-anchor="middle" class="ax">${flab(x)}</text>`;
  }
  // Grille horizontale + graduations y
  const ny = Math.round(g.ymax / g.ystep);
  for (let i = 0; i <= ny; i++) {
    const y = i * g.ystep;
    s += `<line x1="${X(0)}" y1="${Y(y)}" x2="${X(g.xmax)}" y2="${Y(y)}" stroke="${i === 0 ? '#9ca3af' : '#e8e8f2'}" stroke-width="${i === 0 ? 1.5 : 1}"/>`;
    s += `<text x="${X(0) - 7}" y="${Y(y) + 4}" text-anchor="end" class="ax">${flab(y)}</text>`;
  }

  // Droite y = kx + b
  if (g.slope !== undefined) {
    const b = g.intercept || 0;
    const xEnd = Math.min(g.xmax, (g.ymax - b) / g.slope);
    s += `<line x1="${X(0)}" y1="${Y(b)}" x2="${X(xEnd)}" y2="${Y(b + g.slope * xEnd)}" stroke="#5448c8" stroke-width="2.5"/>`;
  }

  // Courbe y = a·x²
  if (g.curve) {
    const a = g.curve.a;
    let d = `M ${X(0)} ${Y(0)}`;
    for (let i = 1; i <= 60; i++) {
      const x = i * g.xmax / 60;
      const y = a * x * x;
      if (y > g.ymax + 1e-9) break;
      d += ` L ${X(x).toFixed(1)} ${Y(y).toFixed(1)}`;
    }
    s += `<path d="${d}" fill="none" stroke="#5448c8" stroke-width="2.5"/>`;
  }

  // Points de mesure (cliquables si g.pointAttr est fourni)
  (g.points || []).forEach(([x, y], idx) => {
    const attr = g.pointAttr ? ' ' + g.pointAttr(idx) : '';
    s += `<circle cx="${X(x)}" cy="${Y(y)}" r="${g.pointAttr ? 7 : 4.5}" fill="#5448c8" stroke="#fff" stroke-width="1.5"${attr}/>`;
  });

  // Point de lecture avec pointillés
  if (g.readPoint) {
    const [px, py] = g.readPoint;
    s += `<line x1="${X(px)}" y1="${Y(py)}" x2="${X(px)}" y2="${Y(0)}" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/>`;
    s += `<line x1="${X(px)}" y1="${Y(py)}" x2="${X(0)}" y2="${Y(py)}" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/>`;
    s += `<circle cx="${X(px)}" cy="${Y(py)}" r="5.5" fill="#d97706" stroke="#fff" stroke-width="1.5"/>`;
    s += `<text x="${X(px) - 9}" y="${Y(py) - 9}" text-anchor="end" class="pt-lbl">A (${fv(px)} ; ${fv(py)})</text>`;
  }

  // Titres d'axes
  s += `<text x="${W - 6}" y="${H - 6}" text-anchor="end" class="ax-t">${g.xlabel}</text>`;
  s += `<text x="${ml}" y="14" text-anchor="start" class="ax-t">${g.ylabel}</text>`;

  if (g.extra) s += g.extra;

  return `<svg ${g.svgAttrs || ''} viewBox="0 0 ${W} ${H}" class="graph${g.svgClass ? ' ' + g.svgClass : ''}" role="img" aria-label="Graphique : ${g.ylabel} en fonction de ${g.xlabel}">${s}</svg>`;
}

function tableHTML(t) {
  return `
  <div class="prop-table-wrap">
    <table class="prop-table">
      ${t.rows.map(r => `<tr><th>${r.label}</th>${r.vals.map(v => `<td>${v}</td>`).join('')}</tr>`).join('')}
    </table>
  </div>`;
}

function stepsHTML(arr) {
  return arr.map(txt => `<div class="step"><span class="step-arrow">→</span> <span>${txt}</span></div>`).join('');
}
function corrHTML(ex) {
  return stepsHTML(ex.corr);
}

// Étape 1 (Terminale) : tester soi-même la proportionnalité avant de l'exploiter
function pickPre(key, i, j) {
  const ex = EXO_PAGES[key].exos[i];
  const pid = `${key}-${i}`;
  const card = document.getElementById(`card${pid}`);
  if (!card || card.dataset.preDone) return;
  card.dataset.preDone = '1';

  ex.pre.choices.forEach((_, c) => {
    const b = document.getElementById(`pre${pid}-${c}`);
    if (!b) return;
    b.disabled = true;
    if (c === ex.pre.correct) b.classList.add('correct');
    else if (c === j) b.classList.add('incorrect');
  });

  const ok = j === ex.pre.correct;
  const fb = document.getElementById(`pfb${pid}`);
  fb.className = `feedback-box visible feedback-${ok ? 'ok' : 'err'}`;
  fb.innerHTML = `<strong>${ok ? '✓ Exact.' : '✗ Non.'}</strong>
    <div class="corr-steps">${stepsHTML(ex.pre.corr)}</div>`;
  document.getElementById(`main${pid}`).style.display = '';
}

    <div class="input-row">
      <input class="answer-input" id="inp${pid}" inputmode="text" placeholder="Ta réponse…" autocomplete="off"
             onkeydown="if(event.key==='Enter') checkExo('${key}',${i})">
      ${ex.unit ? `<span class="unit-suffix">${ex.unit}</span>` : ''}
      <button class="btn btn-primary" id="vbtn${pid}" onclick="checkExo('${key}',${i})">Vérifier</button>
      <button class="btn btn-hint" id="hbtn${pid}" onclick="showHint('${pid}')">Indice</button>
    </div>`;
  } else {
    // QCM : choix textuels, ou visuels (mini-graphiques / tableaux)
    const renderChoice = (c, j) => {
      if (ex.choiceType === 'graph') return `<div class="mcq-glab">Graphique ${j + 1}</div>${graphSVG(c)}`;
      if (ex.choiceType === 'table') return `<div class="mcq-glab">Tableau ${j + 1}</div>${tableHTML(c)}`;
      return c;
    };
    main += `
    <div class="mcq-options${ex.choiceType ? ' mcq-visual' : ''}">
      ${ex.choices.map((c, j) => `<button class="mcq-btn" id="mcq${pid}-${j}" onclick="pickMcq('${key}',${i},${j})">${renderChoice(c, j)}</button>`).join('')}
    </div>
    <div class="input-row">
      <button class="btn btn-hint" id="hbtn${pid}" onclick="showHint('${pid}')">Indice</button>
    </div>`;
  }

  main += `
    <div class="hint-box" id="hint${pid}">${ex.hint}</div>
    <div class="feedback-box" id="fb${pid}"></div>`;

  // Exercice en deux étapes : d'abord tester la proportionnalité, ensuite l'exploiter
  if (ex.pre) {
    const pre = `
    <div class="step-tag">Étape 1 — Tester la proportionnalité</div>
    <div class="exercise-question">${ex.pre.q}</div>
    <div class="mcq-options">
      ${ex.pre.choices.map((c, j) => `<button class="mcq-btn" id="pre${pid}-${j}" onclick="pickPre('${key}',${i},${j})">${c}</button>`).join('')}
    </div>
    <div class="feedback-box" id="pfb${pid}"></div>
    <div id="main${pid}" style="display:none">
      <div class="step-tag" style="margin-top:16px">Étape 2 — Exploiter</div>
      ${main}
    </div>`;
    return `<div class="exercise-card" id="card${pid}">${head}${pre}</div>`;
  }

  return `<div class="exercise-card" id="card${pid}">${head}${main}</div>`;
}

function showHint(pid) {

// ─── B : lecture active du coefficient directeur ────────
function clickReadSlope(evt, key, i) {
  const ex = EXO_PAGES[key].exos[i];
  const pid = `${key}-${i}`;
  const card = document.getElementById(`card${pid}`);
  if (!card || card.dataset.ptDone) return;
  const g = ex.graph;
  const map = graphMap(g);
  const svg = document.getElementById(`rsvg${pid}`);
  const p = map.fromEvent(evt, svg);
  const stat = document.getElementById(`rstat${pid}`);
  if (p.x < 0 || p.x > g.xmax || p.y < 0 || p.y > g.ymax) return;

  if (Math.abs(p.y - g.slope * p.x) > 0.08 * g.ymax) {
    stat.className = 'rs-status warn';
    stat.textContent = 'Clique sur la droite elle-même.';
    return;
  }
  const xs = Math.round(p.x / g.xstep) * g.xstep;
  if (Math.abs(p.x - xs) > 0.3 * g.xstep) {
    stat.className = 'rs-status warn';
    stat.textContent = 'Vise un croisement du quadrillage : les coordonnées du point doivent se lire exactement.';
    return;
  }
  const ys = g.slope * xs;
  const ysnap = Math.round(ys / g.ystep) * g.ystep;
  if (Math.abs(ys - ysnap) > 0.02 * g.ystep) {
    stat.className = 'rs-status warn';
    stat.innerHTML = `En x = ${fv(xs)}, la droite passe <em>entre</em> deux graduations : y ne se lit pas exactement. Essaie un autre croisement.`;
    return;
  }
  if (xs < 0.45 * g.xmax) {
    stat.className = 'rs-status warn';
    stat.innerHTML = `Ce point se lit bien… mais il est <strong>trop proche de l'origine</strong> : la lecture serait peu précise. Choisis un point plus éloigné.`;
    return;
  }
  // Bon point : guides pointillés + libellé, puis on demande k
  card.dataset.ptDone = '1';
  const lbl = fv(parseFloat(ys.toFixed(4)));
  svg.insertAdjacentHTML('beforeend',
    `<line x1="${map.X(xs)}" y1="${map.Y(ys)}" x2="${map.X(xs)}" y2="${map.Y(0)}" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/>
     <line x1="${map.X(xs)}" y1="${map.Y(ys)}" x2="${map.X(0)}" y2="${map.Y(ys)}" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/>
     <circle cx="${map.X(xs)}" cy="${map.Y(ys)}" r="5.5" fill="#d97706" stroke="#fff" stroke-width="1.5"/>
     <text x="${map.X(xs) - 9}" y="${map.Y(ys) - 9}" text-anchor="end" class="pt-lbl">A (${fv(xs)} ; ${lbl})</text>`);
  stat.className = 'rs-status good';
  stat.innerHTML = `✓ Bon choix : A (${fv(xs)} ; ${lbl}) — loin de l'origine et lisible exactement. ② Calcule maintenant k = y<sub>A</sub> / x<sub>A</sub>.`;
  document.getElementById(`rinp${pid}`).style.display = '';
}

// ─── D : repérer le point de mesure aberrant ────────────
function pointRing(map, x, y, color) {
  return `<circle cx="${map.X(x)}" cy="${map.Y(y)}" r="12" fill="none" stroke="${color}" stroke-width="3"/>`;
}

function pickAberrant(key, i, idx) {
  const ex = EXO_PAGES[key].exos[i];
  const pid = `${key}-${i}`;
  const card = document.getElementById(`card${pid}`);
  if (!card || card.dataset.done) return;
  const map = graphMap(ex.graph);
  const svg = document.getElementById(`ppsvg${pid}`);
  const fb  = document.getElementById(`fb${pid}`);
  const ok  = idx === ex.aberrant;
  const tries = parseInt(card.dataset.tries || '0', 10) + 1;
  card.dataset.tries = tries;

  if (!ok && tries === 1) {
    const [px, py] = ex.graph.points[idx];
    svg.insertAdjacentHTML('beforeend', pointRing(map, px, py, '#dc2626'));
    showHint(pid);
    fb.className = 'feedback-box visible feedback-err';
    fb.innerHTML = `<strong>✗ Pas celui-ci</strong> — ce point est cohérent avec les autres. Un indice s'est affiché ; il te reste un essai.`;
    return;
  }

  card.dataset.done = '1';
  if (!ok) {
    const [px, py] = ex.graph.points[idx];
    svg.insertAdjacentHTML('beforeend', pointRing(map, px, py, '#dc2626'));
  }
  // on entoure l'aberrant et on trace la droite moyenne (sans lui)
  const [ax, ay] = ex.graph.points[ex.aberrant];
  const xEnd = Math.min(ex.graph.xmax, ex.graph.ymax / ex.modelSlope);
  svg.insertAdjacentHTML('beforeend',
    pointRing(map, ax, ay, '#16a34a') +
    `<line x1="${map.X(0)}" y1="${map.Y(0)}" x2="${map.X(xEnd)}" y2="${map.Y(ex.modelSlope * xEnd)}" stroke="#5448c8" stroke-width="2" stroke-dasharray="6 4"/>`);
  const hbtn = document.getElementById(`hbtn${pid}`);
  if (hbtn) hbtn.style.display = 'none';
  fb.className = `feedback-box visible feedback-${ok ? 'ok' : 'err'}`;
  fb.innerHTML = `<strong>${ok ? '✓ Bien vu !' : '✗ Incorrect — c\'était le point entouré en vert.'}</strong>
    <div class="corr-steps">${corrHTML(ex)}</div>`;
}

// ─── F : TP virtuel — construire la droite d'étalonnage ─
const TP_STATE = {};

function clickTP(evt, key, i) {
  const ex = EXO_PAGES[key].exos[i];
  const pid = `${key}-${i}`;
  const st = TP_STATE[pid];
  if (!st || st.done) return;
  const g = ex.graph;
  const map = graphMap(g);
  const svg = document.getElementById(`tpsvg${pid}`);
  const p = map.fromEvent(evt, svg);
  const stat = document.getElementById(`tpstat${pid}`);
  if (p.x < 0 || p.x > g.xmax || p.y < 0 || p.y > g.ymax) return;

  // accrochage au croisement de quadrillage le plus proche
  const xs = Math.round(p.x / g.xstep) * g.xstep;
  const ys = Math.round(p.y / g.ystep) * g.ystep;
  const idx = ex.etalons.findIndex(([cx, cy]) =>
    Math.abs(cx - xs) < g.xstep * 0.01 && Math.abs(cy - ys) < g.ystep * 0.01);

  if (idx === -1) {
    stat.className = 'rs-status warn';
    stat.innerHTML = `(${fv(parseFloat(xs.toFixed(4)))} ; ${fv(parseFloat(ys.toFixed(4)))}) ne correspond à aucune mesure du tableau — vérifie tes coordonnées.`;
    return;
  }
  if (st.placed.includes(idx)) {
    stat.className = 'rs-status warn';
    stat.textContent = 'Ce point est déjà placé — il en reste d\'autres !';
    return;
  }
  st.placed.push(idx);
  const [px, py] = ex.etalons[idx];
  svg.insertAdjacentHTML('beforeend',
    `<circle cx="${map.X(px)}" cy="${map.Y(py)}" r="5" fill="#16a34a" stroke="#fff" stroke-width="1.5"/>`);

  if (st.placed.length < ex.etalons.length) {
    stat.className = 'rs-status good';
    stat.textContent = `✓ ${st.placed.length} / ${ex.etalons.length} points placés — continue !`;
    return;
  }
  // tous placés : la droite d'étalonnage se trace
  st.done = true;
  const xEnd = Math.min(g.xmax, g.ymax / ex.k);
  svg.insertAdjacentHTML('beforeend',
    `<line x1="${map.X(0)}" y1="${map.Y(0)}" x2="${map.X(xEnd)}" y2="${map.Y(ex.k * xEnd)}" stroke="#5448c8" stroke-width="2.5"/>`);
  stat.className = 'rs-status good';
  stat.innerHTML = `✓ Les ${ex.etalons.length} points sont <strong>alignés avec l'origine</strong> : on trace la droite d'étalonnage. Passe à l'étape 2.`;
  document.getElementById(`tpinp${pid}`).style.display = '';
}

// après un dosage réussi : matérialiser la lecture graphique
function tpShowReading(pid, ex) {
  const svg = document.getElementById(`tpsvg${pid}`);
  if (!svg) return;
  const map = graphMap(ex.graph);
  const cx = ex.answer, cy = ex.unknownA;
  svg.insertAdjacentHTML('beforeend',
    `<line x1="${map.X(0)}" y1="${map.Y(cy)}" x2="${map.X(cx)}" y2="${map.Y(cy)}" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/>
     <line x1="${map.X(cx)}" y1="${map.Y(cy)}" x2="${map.X(cx)}" y2="${map.Y(0)}" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/>
     <circle cx="${map.X(cx)}" cy="${map.Y(cy)}" r="5.5" fill="#d97706" stroke="#fff" stroke-width="1.5"/>`);
}

function checkExo(key, i) {
  const ex = EXO_PAGES[key].exos[i];
  const pid = `${key}-${i}`;
  const inp = document.getElementById(`inp${pid}`);
  const fb  = document.getElementById(`fb${pid}`);
  if (!inp || !fb || inp.disabled) return;

  const raw    = inp.value;
  const parsed = parseAnswer(raw);
  const ok     = isCorrect(parsed, ex.answer, ex.tol);
  const card   = document.getElementById(`card${pid}`);
  const tries  = parseInt(card.dataset.tries || '0', 10) + 1;
  card.dataset.tries = tries;

  // Première erreur : indice automatique, l'élève retente (la correction attendra)
  if (!ok && tries === 1) {
    inp.classList.add('incorrect');
    showHint(pid);
    fb.className = 'feedback-box visible feedback-err';
    fb.innerHTML = `<strong>✗ Pas encore.</strong> Un indice s'est affiché — corrige ta réponse et vérifie à nouveau.`;
    inp.addEventListener('input', () => {
      inp.classList.remove('incorrect');
      fb.classList.remove('visible');
    }, { once: true });
    inp.focus();
    return;
  }

  inp.classList.toggle('correct',   ok);
  inp.classList.toggle('incorrect', !ok);
  inp.disabled = true;
  const vbtn = document.getElementById(`vbtn${pid}`);
  if (vbtn) vbtn.disabled = true;
  const hbtn = document.getElementById(`hbtn${pid}`);
  if (hbtn) hbtn.style.display = 'none';

  fb.className = `feedback-box visible feedback-${ok ? 'ok' : 'err'}`;
  if (ok) {
    fb.innerHTML = `<strong>✓ Correct !</strong> &nbsp; ${ex.fmt}
      <div class="corr-steps">${corrHTML(ex)}</div>`;
    if (ex.kind === 'tp') tpShowReading(pid, ex);
  } else {
    const yourTxt = raw.trim() ? `Ta réponse : <em>${raw}</em>` : 'Aucune réponse saisie.';
    fb.innerHTML = `<strong>✗ Incorrect.</strong> ${yourTxt}
      <div class="corr-steps">${corrHTML(ex)}</div>`;
  }
}

function pickMcq(key, i, j) {
  const ex = EXO_PAGES[key].exos[i];
  const pid = `${key}-${i}`;
  const card = document.getElementById(`card${pid}`);
  if (!card || card.dataset.done) return;

  const tries = parseInt(card.dataset.tries || '0', 10) + 1;
  card.dataset.tries = tries;

  // Première erreur sur un QCM à plus de 2 choix : indice automatique + second essai
  if (j !== ex.correct && tries === 1 && ex.choices.length > 2) {
    const b = document.getElementById(`mcq${pid}-${j}`);
    if (b) { b.classList.add('incorrect'); b.disabled = true; }
    showHint(pid);
    const fb0 = document.getElementById(`fb${pid}`);
    fb0.className = 'feedback-box visible feedback-err';
    fb0.innerHTML = `<strong>✗ Pas celle-ci.</strong> Un indice s'est affiché — il te reste un essai.`;
    return;
  }
  card.dataset.done = '1';

  ex.choices.forEach((_, c) => {
    const b = document.getElementById(`mcq${pid}-${c}`);
    if (!b) return;
    b.disabled = true;
    if (c === ex.correct) b.classList.add('correct');
    else if (c === j) b.classList.add('incorrect');
  });
  const hbtn = document.getElementById(`hbtn${pid}`);
  if (hbtn) hbtn.style.display = 'none';

  const ok = j === ex.correct;
  const fb = document.getElementById(`fb${pid}`);
  fb.className = `feedback-box visible feedback-${ok ? 'ok' : 'err'}`;
  fb.innerHTML = `<strong>${ok ? '✓ Bonne réponse !' : '✗ Incorrect.'}</strong>
    <div class="corr-steps">${corrHTML(ex)}</div>`;
}

        <div class="step"><span class="step-arrow">→</span><span>Si le volume double, le prix double : 20 L coûtent 2 × 17,00 = 34,00 € — sans calculer k. Imbattable quand les valeurs sont doubles, moitiés, triples…</span></div>
      </div>
      <div class="bloc bloc-result">
        <div class="bloc-title">Résultat</div>
        <span class="formula-box">12 L → 20,40 €</span>
      </div>

      <div class="note-box">
        <strong>Trois chemins, un même résultat.</strong> Le retour au coefficient est le plus universel
        (et k a presque toujours un sens physique), le produit en croix est rapide pour une valeur isolée,
        la linéarité est la plus élégante quand les nombres s'y prêtent.
      </div>
    </div>
  </div>

  <!-- ── MÉTHODE C ─────────────────────────── -->
  <div class="technique">
    <div class="technique-header">Méthode C — La représentation graphique</div>
    <div class="technique-body">
      <div class="objectif-line">
        Deux grandeurs sont proportionnelles <strong>si et seulement si</strong> les points du graphique sont
        <strong>alignés</strong> sur une droite qui <strong>passe par l'origine</strong>.
      </div>

      <div class="example-header">L'exemple de l'essence, en graphique</div>
      <div class="graph-wrap">
        ${graphSVG({ xmax: 20, xstep: 5, ymax: 35, ystep: 5, xlabel: 'V (L)', ylabel: 'Prix (€)', slope: 1.7, points: [[5, 8.5], [10, 17], [20, 34]] })}
        <p class="graph-caption"><strong class="oui">✓ Proportionnalité</strong> — points alignés <em>et</em> droite passant par l'origine (0 litre → 0 €).</p>
      </div>

      <div class="example-header">Deux pièges classiques</div>
      <div class="graph-row">
        <div>
          ${graphSVG({ xmax: 4, xstep: 1, ymax: 14, ystep: 2, xlabel: 'Durée (h)', ylabel: 'Prix (€)', slope: 3, intercept: 2, points: [[1, 5], [2, 8], [3, 11]] })}
          <p class="graph-caption"><strong class="non">✗ Non proportionnel</strong> — les points sont alignés, mais la droite <em>ne passe pas par l'origine</em> (location de vélo : forfait de 2 €).</p>
        </div>
        <div>
          ${graphSVG({ xmax: 4, xstep: 1, ymax: 16, ystep: 2, xlabel: 'Côté (cm)', ylabel: 'Aire (cm²)', curve: { a: 1 }, points: [[1, 1], [2, 4], [3, 9]] })}
          <p class="graph-caption"><strong class="non">✗ Non proportionnel</strong> — la courbe passe par l'origine, mais les points <em>ne sont pas alignés</em> (aire d'un carré = côté²).</p>
        </div>
      </div>

      <div class="note-box">
        <strong>Les deux conditions sont obligatoires :</strong> points alignés <em>et</em> passage par l'origine.
        Une seule des deux ne suffit jamais.
      </div>

      <div class="note-box">
        <strong>🔗 Le pont avec le cours de maths :</strong> la relation y = k × x s'appelle une
        <strong>fonction linéaire</strong> — sa représentation est précisément une droite passant par l'origine.
        Une droite qui ne passe pas par l'origine représente une <strong>fonction affine</strong> y = a x + b
        (avec b ≠ 0) : il n'y a alors pas proportionnalité. Retiens l'équivalence :
        <em>grandeurs proportionnelles ⇔ fonction linéaire ⇔ droite passant par l'origine</em>.
      </div>
    </div>
  </div>

  <!-- ── MÉTHODE D ─────────────────────────── -->
  <div class="technique">
    <div class="technique-header">Méthode D — Le coefficient directeur : rôle et détermination</div>
    <div class="technique-body">
      <div class="objectif-line">
        La droite d'une proportionnalité a pour équation <strong>y = k × x</strong>.
        Le nombre k est le <strong>coefficient directeur</strong> de la droite : c'est sa « pente ».
        Il indique de combien augmente y quand x augmente de 1.
      </div>

      <div class="bloc bloc-alg">
        <div class="bloc-title">Son rôle en physique-chimie</div>
        <div class="step"><span class="step-arrow">→</span><span>k porte une <strong>unité</strong> : (unité de y) <em>par</em> (unité de x) — par exemple des €/L, des km/h, des g/mol…</span></div>
        <div class="step"><span class="step-arrow">→</span><span>Cette unité révèle sa signification : le coefficient directeur <strong>est</strong> très souvent une grandeur physique (vitesse, masse volumique, résistance, concentration…)</span></div>
        <div class="step"><span class="step-arrow">→</span><span>Une fois k connu, on calcule y pour n'importe quel x (y = k × x) ou x pour n'importe quel y (x = y / k)</span></div>
      </div>

      <div class="example-header">Exemple — Déterminer k sur un graphique</div>
      <div class="example-q">Un mobile se déplace à vitesse constante. Déterminer le coefficient directeur de la droite ci-dessous.</div>
      <div class="graph-wrap">
        ${graphSVG({ xmax: 8, xstep: 1, ymax: 20, ystep: 2, xlabel: 't (s)', ylabel: 'd (m)', slope: 2.5, readPoint: [8, 20] })}
      </div>
      <div class="bloc bloc-alg">
        <div class="bloc-title">Démarche pas à pas</div>
        <div class="step"><span class="step-num">1</span><span><strong>Choisir un point</strong> A sur la droite, bien lisible sur le quadrillage et le plus loin possible de l'origine (meilleure précision de lecture)</span></div>
        <div class="step"><span class="step-num">2</span><span><strong>Lire ses coordonnées</strong> : A (8 ; 20)</span></div>
        <div class="step"><span class="step-num">3</span><span><strong>Calculer</strong> k = y<sub>A</sub> / x<sub>A</sub> = 20 / 8 = 2,5 — sans oublier l'unité : des mètres par seconde</span></div>
      </div>
      <div class="bloc bloc-result">
        <div class="bloc-title">Résultat et interprétation</div>
        <span class="formula-box">k = 20 / 8 = 2,5 m/s</span>
        <p style="margin-top:10px; font-size:0.95rem">Le coefficient directeur est la <strong>vitesse</strong> du mobile : il parcourt 2,5 m chaque seconde, et d = 2,5 × t.</p>
      </div>

      <div class="note-box">
        <strong>Pour aller plus loin (Première/Terminale) :</strong> pour une droite quelconque passant par deux points
        A et B, le coefficient directeur se calcule par k = (y<sub>B</sub> − y<sub>A</sub>) / (x<sub>B</sub> − x<sub>A</sub>).
        Si la droite passe par l'origine, prendre A = O(0 ; 0) redonne bien k = y<sub>B</sub> / x<sub>B</sub>.
      </div>
    </div>
  </div>

  <div class="nav-bottom">
    <button class="btn btn-p2" onclick="showExoPage('p2')">Passer à la pratique guidée →</button>
  </div>`;
  window.scrollTo(0, 0);
}
