<script>
// ═══════════════════════════════════════════════════════

    }
  }
};

const CATEGORIE_LABEL = { maths: '🧮 Automatisme mathématique', connaissance: '📖 Connaissance', technique: '🔧 Technique' };
const NEVER_SEEN_WEIGHT = 100;

// ═══════════════════════════════════════════════════════
// UTILITAIRES
// ═══════════════════════════════════════════════════════

async function fetchJSON(path) {
  const r = await fetch(path, { cache: 'no-store' });
  if (!r.ok) throw new Error('not found: ' + path);
  return r.json();
}
async function fetchText(path) {
  const r = await fetch(path, { cache: 'no-store' });
  if (!r.ok) throw new Error('not found: ' + path);
  return r.text();
}

function mdToHtml(md) {
  let s = (md || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\n/g, '<br>');
  return s;
}

function parseProgression(text) {
  return text.split('\n').map(l => l.trim()).filter(Boolean).map(line => {
    const m = line.match(/^\[([ xX])\]\s+(\S+)\s+(.*)$/);
    if (!m) return null;
    return { checked: m[1].toLowerCase() === 'x', code: m[2], title: m[3] };
  }).filter(Boolean);
}
function serializeProgression(items) {
  return items.map(it => `[${it.checked ? 'x' : ' '}] ${it.code} ${it.title}`).join('\n') + '\n';
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function weight(q, historique, semaine) {
  const last = historique[q.id];
  if (last == null) return NEVER_SEEN_WEIGHT;
  return Math.max(1, semaine - last);
}

function weightedPickDiverse(pool, historique, semaine, n, diversifyKey) {
  let items = pool.slice();
  const picked = [];
  for (let k = 0; k < n && items.length; k++) {
    const weights = items.map(q => weight(q, historique, semaine));
    const total = weights.reduce((a, b) => a + b, 0);
    let r = Math.random() * total;
    let idx = weights.findIndex(w => (r -= w) <= 0);
    if (idx === -1) idx = items.length - 1;
    const chosen = items[idx];
    picked.push(chosen);
    items = diversifyKey ? items.filter(q => q[diversifyKey] !== chosen[diversifyKey]) : items.filter(q => q.id !== chosen.id);
  }
  return picked;
}

function genererFeuille(banque, progressionCodes, historique, semaine) {
  const mathsPool = banque.filter(q => q.chapitre === 'maths_transversales');
  const chapPool = banque.filter(q => q.chapitre !== 'maths_transversales' && progressionCodes.has(q.chapitre));

  const maths = weightedPickDiverse(mathsPool, historique, semaine, 2, null);
  const usedIds = new Set(maths.map(q => q.id));
  const specifiques = weightedPickDiverse(chapPool.filter(q => !usedIds.has(q.id)), historique, semaine, 5, 'chapitre');

  let all = [...specifiques, ...maths];
  if (all.length < 7) {
    const manque = 7 - all.length;
    const usedIds2 = new Set(all.map(q => q.id));
    const extra = weightedPickDiverse(mathsPool.filter(q => !usedIds2.has(q.id)), historique, semaine, manque, null);
    all = all.concat(extra);
  }
  return { questions: shuffle(all), incomplet: all.length < 7 };
}

function downloadFile(filename, content) {
  const blob = new Blob([content], { type: 'application/octet-stream' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

function typeset(el) { if (window.MathJax) MathJax.typesetPromise([el]); }

// ═══════════════════════════════════════════════════════
// RENDU — COMPOSANTS PARTAGÉS
// ═══════════════════════════════════════════════════════

function sheetHTML(niveau, semaine, questions) {
  const chapters = LEVELS[niveau].chapters;
  return `
  <div class="sheet-card">
    <div class="sheet-header">
      <div class="sheet-title">Semaine ${semaine} — ${LEVELS[niveau].label}</div>
      <div class="sheet-sub">Révisions espacées · une question par jour</div>
    </div>
    ${questions.map((q, i) => `
    <div class="jour-block">
      <div class="jour-label tag-${q.categorie}">
        Jour ${i + 1} — ${CATEGORIE_LABEL[q.categorie] || q.categorie}
        ${q.chapitre !== 'maths_transversales' ? `<span class="jour-chapitre">· ${chapters[q.chapitre] || q.chapitre}</span>` : ''}
      </div>
      <div class="jour-enonce">${mdToHtml(q.enonce)}</div>
    </div>`).join('')}
  </div>`;
}

// ═══════════════════════════════════════════════════════
// PAGE — ACCUEIL
// ═══════════════════════════════════════════════════════

async function renderAccueil() {
  const app = document.getElementById('app');
  app.innerHTML = `

  <p class="home-title">📅 Révision hebdomadaire</p>

  <div class="level-cards" id="level-cards">
    ${Object.keys(LEVELS).map(k => `
    <a class="level-card" href="?niveau=${k}">
      <div>
        <div class="level-card-title">${LEVELS[k].label}</div>
        <div class="level-card-desc" id="desc-${k}">Chargement…</div>

      <div class="level-card-arrow">→</div>
    </a>`).join('')}
  </div>
  <div class="footer-link"><a href="?mode=enseignant">🔒 Espace enseignant</a></div>`;

  for (const k of Object.keys(LEVELS)) {
    const el = document.getElementById(`desc-${k}`);
    try {
      const hist = await fetchJSON(`data/historique-${k}.json`);
      const vals = Object.values(hist);
      el.textContent = vals.length ? `Dernière feuille : semaine ${Math.max(...vals)}` : 'Aucune feuille générée pour l\'instant';

}

// ═══════════════════════════════════════════════════════
// PAGE — CONSULTATION (feuille élève)
// ═══════════════════════════════════════════════════════

async function renderConsultation(niveau, semaine) {
  const app = document.getElementById('app');
  if (!LEVELS[niveau]) { app.innerHTML = `<div class="notice notice-err">Niveau inconnu.</div>`; return; }

  app.innerHTML = `<div class="notice notice-info">Chargement de la feuille…</div>`;

  let hist = {};
  try { hist = await fetchJSON(`data/historique-${niveau}.json`); } catch (e) {}

  if (semaine == null) {
    const vals = Object.values(hist);
    if (!vals.length) {
      app.innerHTML = `
      <a href="?" class="btn-back">← Accueil</a>
      <div class="notice notice-warn">Aucune feuille n'a encore été générée pour ce niveau.</div>
      <div class="footer-link"><a href="?niveau=${niveau}&mode=enseignant">🔒 Générer une feuille (espace enseignant)</a></div>`;
      return;
    }
    semaine = Math.max(...vals);
  }

  let feuille;
  try {
    feuille = await fetchJSON(`data/feuilles/${niveau}-semaine-${semaine}.json`);
  } catch (e) {
    app.innerHTML = `
    <a href="?" class="btn-back">← Accueil</a>
    <div class="notice notice-err">La feuille "semaine ${semaine}" n'existe pas pour ce niveau.</div>`;
    return;
  }

  app.innerHTML = `
  <a href="?" class="btn-back no-print">← Accueil</a>
  <div class="level-select no-print">
    ${Object.keys(LEVELS).map(k => `<a class="level-btn ${k === niveau ? 'active' : ''}" href="?niveau=${k}">${LEVELS[k].label}</a>`).join('')}
  </div>
  ${sheetHTML(niveau, semaine, feuille.questions)}
  <div class="nav-bottom no-print">
    <button class="btn btn-primary" onclick="window.print()">🖨️ Imprimer / PDF</button>
    <a class="btn btn-outline" href="?niveau=${niveau}&mode=enseignant">🔒 Espace enseignant</a>
  </div>`;
  typeset(app);
}

// ═══════════════════════════════════════════════════════
// PAGE — ESPACE ENSEIGNANT
// ═══════════════════════════════════════════════════════

async function renderEnseignant(niveauInitial) {
  const app = document.getElementById('app');
  const niveau = LEVELS[niveauInitial] ? niveauInitial : '2nde';

  app.innerHTML = `<div class="notice notice-info">Chargement…</div>`;

  const [banque, progressionText, historique] = await Promise.all([
    fetchJSON(`data/banque-${niveau}.json`),
    fetchText(`data/progression-${niveau}.txt`),
    fetchJSON(`data/historique-${niveau}.json`).catch(() => ({})),
  ]);
  const progression = parseProgression(progressionText);
  const vals = Object.values(historique);
  const prochaineSemaine = vals.length ? Math.max(...vals) + 1 : 1;

  app.innerHTML = `
  <a href="?" class="btn-back">← Accueil</a>
  <h1>🔒 Espace enseignant — ${LEVELS[niveau].label}</h1>

  <div class="level-select">
    ${Object.keys(LEVELS).map(k => `<a class="level-btn ${k === niveau ? 'active' : ''}" href="?niveau=${k}&mode=enseignant">${LEVELS[k].label}</a>`).join('')}
  </div>

  <div class="section-label">Progression — chapitres traités</div>
  <div class="progression-list" id="progression-list">
    ${progression.map((it, i) => `
    <div class="progression-item">
      <input type="checkbox" id="chk-${i}" ${it.checked ? 'checked' : ''}>
      <label for="chk-${i}">${it.title}<span class="progression-code">${it.code}</span></label>
    </div>`).join('')}
  </div>
  <div class="nav-bottom">
    <button class="btn btn-outline" onclick="exporterProgression('${niveau}')">⬇ Exporter la progression</button>
  </div>
  <div id="progression-export-zone"></div>

  <div class="section-label">Générer la feuille de la semaine</div>
  <div class="field-row">
    <label for="semaine-input">Numéro de semaine</label>
    <input type="number" id="semaine-input" min="1" value="${prochaineSemaine}">
    <button class="btn btn-primary" onclick="genererApercu('${niveau}')">Générer</button>
  </div>
  <div id="apercu-zone"></div>

  <div class="footer-link"><a href="?niveau=${niveau}">Voir la feuille de révision (élèves) →</a></div>`;

  window.__revisionState = { niveau, banque, progression, historique };
}

function exporterProgression(niveau) {
  const state = window.__revisionState;
  const items = state.progression.map((it, i) => ({
    ...it, checked: document.getElementById(`chk-${i}`).checked,
  }));
  state.progression = items;
  window.__progressionExport = serializeProgression(items);

  const zone = document.getElementById('progression-export-zone');
  zone.innerHTML = `
  <div class="notice notice-info">
    <strong>1 fichier à télécharger et déposer à cet emplacement exact :</strong>
    <div class="dl-path">
      <button class="btn btn-outline" onclick="telechargerProgression('${niveau}')">⬇ progression-${niveau}.txt</button>
      <span class="dl-arrow">→</span><span class="dl-dest">revision-hebdo/data/progression-${niveau}.txt</span>
      <span class="dl-note">(remplace le fichier existant)</span>
    </div>
    Puis, depuis le dossier du projet : <code>git add revision-hebdo/data/progression-${niveau}.txt</code> · <code>git commit -m "Progression — ${LEVELS[niveau].label}"</code> · <code>git push</code>.
  </div>`;
}

function telechargerProgression(niveau) {
  downloadFile(`progression-${niveau}.txt`, window.__progressionExport);
}

function genererApercu(niveau) {
  const state = window.__revisionState;
  const semaine = parseInt(document.getElementById('semaine-input').value, 10);
  if (!semaine || semaine < 1) return;

  const progressionCodes = new Set(state.progression.filter(it => {
    const idx = state.progression.indexOf(it);
    return document.getElementById(`chk-${idx}`).checked;
  }).map(it => it.code));

  const { questions, incomplet } = genererFeuille(state.banque, progressionCodes, state.historique, semaine);
  window.__revisionApercu = { niveau, semaine, questions };

  const zone = document.getElementById('apercu-zone');
  zone.innerHTML = `
  ${incomplet ? `<div class="notice notice-warn">Peu de chapitres débloqués : la feuille contient moins de 5 questions spécifiques, complétée par des automatismes mathématiques.</div>` : ''}
  ${questions.length === 0 ? `<div class="notice notice-err">Aucune question disponible — cochez au moins un chapitre dans la progression.</div>` : sheetHTML(niveau, semaine, questions)}
  ${questions.length ? `
  <div class="nav-bottom">
    <button class="btn btn-outline" onclick="genererApercu('${niveau}')">🔄 Régénérer</button>
    <button class="btn btn-primary" onclick="validerFeuille()">✓ Valider et enregistrer</button>
  </div>` : ''}`;
  typeset(zone);
}

function validerFeuille() {
  const state = window.__revisionState;
  const apercu = window.__revisionApercu;
  if (!apercu) return;

  const newHistorique = { ...state.historique };
  apercu.questions.forEach(q => { newHistorique[q.id] = apercu.semaine; });
  state.historique = newHistorique;

  const feuille = {
    niveau: apercu.niveau,
    semaine: apercu.semaine,
    date_generation: new Date().toISOString(),
    questions: apercu.questions,
  };

  window.__validation = { niveau: apercu.niveau, semaine: apercu.semaine, newHistorique, feuille };

  const zone = document.getElementById('apercu-zone');
  zone.innerHTML += `
  <div class="notice notice-info">
    <strong>2 fichiers à télécharger (un clic chacun) et à déposer à ces emplacements exacts :</strong>
    <div class="dl-path">
      <button class="btn btn-outline" onclick="telechargerHistorique()">⬇ historique-${apercu.niveau}.json</button>
      <span class="dl-arrow">→</span><span class="dl-dest">revision-hebdo/data/historique-${apercu.niveau}.json</span>
      <span class="dl-note">(remplace le fichier existant)</span>
    </div>
    <div class="dl-path">
      <button class="btn btn-outline" onclick="telechargerFeuilleGeneree()">⬇ ${apercu.niveau}-semaine-${apercu.semaine}.json</button>
      <span class="dl-arrow">→</span><span class="dl-dest">revision-hebdo/data/feuilles/${apercu.niveau}-semaine-${apercu.semaine}.json</span>
      <span class="dl-note">(nouveau fichier)</span>
    </div>
    Puis, depuis le dossier du projet : <code>git add revision-hebdo/data/</code> · <code>git commit -m "Semaine ${apercu.semaine} — ${LEVELS[apercu.niveau].label}"</code> · <code>git push</code>.
  </div>`;
}

function telechargerHistorique() {
  const v = window.__validation;
  if (!v) return;
  downloadFile(`historique-${v.niveau}.json`, JSON.stringify(v.newHistorique, null, 2));
}

function telechargerFeuilleGeneree() {
  const v = window.__validation;
  if (!v) return;
  downloadFile(`${v.niveau}-semaine-${v.semaine}.json`, JSON.stringify(v.feuille, null, 2));
}

// ═══════════════════════════════════════════════════════
// DÉMARRAGE
// ═══════════════════════════════════════════════════════

function init() {
  const params = new URLSearchParams(location.search);
  const niveau = params.get('niveau');
  const mode = params.get('mode');
  if (mode === 'enseignant') return renderEnseignant(niveau);
  if (!niveau) return renderAccueil();
  const semaine = params.get('semaine');
  return renderConsultation(niveau, semaine ? parseInt(semaine, 10) : null);
}
init();
</script>
